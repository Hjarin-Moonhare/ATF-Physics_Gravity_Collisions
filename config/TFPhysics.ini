; TF Physics settings (read when the game starts)
[Gravity]
; 1 = the plugin drives breast gravity from the chest's tilt; 0 = its gravity offsets and shapes are off (the body's
; own lying-down correctives still work). Springs, spring gravity and collisions have their own switches below
bEnabled=1
; forward hang when bending fully forward, in cm, before the installed gravity level (Normal x1, Plus x2, Max x3)
fHangCm=1.2
; flatten toward the chest when lying face down, in cm, before the level
fPressCm=0.5
; tilts of the chest smaller than this (degrees) change nothing, so normal standing is untouched
fDeadZoneDeg=10
; hip tilt (degrees) where "forward" starts to mean lying face down, and where it fully does
fLyingStartDeg=35
fLyingFullDeg=75
; ... but only with the thighs flat too (degrees from vertical where that starts, and where it fully is). On all fours
; or in a deep bend the thighs stay near vertical, so the breasts hang instead of being pressed
fThighFlatStartDeg=30
fThighFlatFullDeg=60
; lying on the back: 0 = the whole breast slides, 1 = the breasts slump to the sides and separate,
; up to 1.5 for a softer, wider slump (more skin stretch)
fSlump=1.0
; the per-bone shapes below: 0 = off (only the whole breast moves), 1 = as designed, up to 1.5
; lying on a side: the lower breast spreads toward the floor and armpit, the upper one rolls over onto it
fSideSlump=1.0
; lying face down: squashed back onto the chest and spread up, down and out
fFaceDownSquash=1.0
; bent forward on the feet: a teardrop hang (the tip hangs most, the base closes in)
fHangShape=1.0
; 1 = the stretch guard: smaller or thinner breasts stretch more for the same movement, so each body's gravity
; shapes stop where its skin stretches as much as the base body's does at its limits, and from Plus gravity up
; the breasts' spring gravity is held too; the base body is unchanged. 0 = off (every body the full amount)
bStretchGuard=1
; the largest effective level (the installed level x the breast size) of each gravity shape: lying on the back,
; lying on a side, bent forward (and on all fours), face down (0.5 to 8). The skin starts to fold above about x3.5
; on the back and on a side, x5.75 bent forward and x6 face down
fMaxBack=2.0
fMaxSide=2.4
fMaxHang=2.3
fMaxDown=3.0
; the breast gravity level for every body, in place of the installed one (0.5 to 8; 0 = the installed level). A
; normal or bigger breast gets this level in every shape, and it is their largest level too (the largest levels
; above and [Size] fMaxLevel hold only the installed level); smaller or thinner breasts get less (x their size, and
; the stretch guard). A tuning file's [Breasts] fGravityLevel replaces it, and its fGravityBack, fGravitySide,
; fGravityHang and fGravityDown set one shape each the same way
fLevel=0
; the gravity shapes of the butt, belly, thighs, hips, calves, upper arms and torso: their soft bones settle toward the
; floor when the body lies down or goes on all fours, on top of the springs' own sag, up to this times the settle each
; part's skin takes cleanly (1 = all of it; 0 = off; up to 2). A tuning file's [<part>] fGravityShape sets one part
fGravityShape=0

[Springs]
; 1 = every A-Body spring keeps its 60 fps travel limit at any frame rate (the look the presets were tuned at)
; 0 = the game's own behaviour (more movement at low fps, less at high fps)
bFixedFrameRate=1
; gravity inside the breast springs, as a fraction of 1 g: when the body tilts or lies down they swing and settle
; under gravity. 0 = off; 0.06 adds about 0.65 cm of springy sag on Realistic; up to 0.3
fSpringGravity=0.06
; the same for the other jiggle springs: they settle when lying down or on all fours. 0 = off; up to 0.3.
; A spring's steady sag stops at 85% of its travel, so past that point more gravity adds nothing in that direction
; (the firm parts' springs travel least: the hips, calves and arms reach it at about 0.03 and the torso at about
; 0.013 when lying down)
fSpringGravityBelly=0.03
fSpringGravityButt=0.04
fSpringGravityThighs=0.0
fSpringGravityHips=0.0
fSpringGravityCalves=0.0
fSpringGravityArms=0.0
fSpringGravityTorso=0.0
; 1 = while the game is paused (photo mode), every soft part sits where gravity rests it for the pose: the springs'
; frozen bounce is dropped, and their own steady sag and the parts' gravity shapes are shown. 0 = the frozen bounce
bSettleWhenPaused=1

[Size]
; 1 = breast gravity follows the breast size sliders (Breasts Large / Small): bigger sags more. With [BodyShape]
; on, the breasts' jiggle follows them too
bEnabled=1
; gravity x (1 + fLarge x the Large slider - fSmall x the Small slider), sliders 0 to 1
fLarge=0.5
fSmall=0.5
; above 0: use this factor for every body instead of the sliders (to try the scaling by hand, e.g. 1.5)
fOverride=0
; the installed level x the size factor never goes above this (0.5 to 8). Each shape also stops at its own largest
; level ([Gravity] fMaxBack, fMaxSide, fMaxHang, fMaxDown)
fMaxLevel=3.0

[BodyShape]
; 1 = each body's jiggle and gravity follow its shape (the body triangle in the looks menu) and its part sliders.
; The centre of the triangle with every slider at 0 is the physics as installed; thin lowers jiggle and gravity,
; muscular is firmer (less jiggle, a little more gravity), heavy raises both; a bigger part moves more, a smaller one
; less. Jiggle never travels further than the Max physics + Max extra jiggle install does, on any setting.
; 0 = off (only the breast size sliders count, as in [Size])
bEnabled=1
; jiggle x (1 + fJiggleThin x thin + fJiggleMuscular x muscular + fJiggleHeavy x heavy); thin, muscular and heavy are
; 0 to 1, how far the body sits toward that corner of the triangle (-0.9 to 1.5 each)
fJiggleThin=-0.4
fJiggleMuscular=-0.25
fJiggleHeavy=0.6
; gravity the same way (the breast gravity shapes and the gravity inside every jiggle spring)
fGravityThin=-0.3
fGravityMuscular=0.15
fGravityHeavy=0.5
; on the belly, heavy counts this many times over (a heavy body's belly moves most)
fBellyHeavy=1.5
; each part x (1 + this x its Large slider - this x its Small slider), sliders 0 to 1 (0 = the sliders don't count,
; up to 0.9). The breasts use [Size] fLarge and fSmall
fButt=0.5
fHips=0.3
fThighs=0.5
fCalves=0.5
fArms=0.5
; the belly x (1 - this x Waist Thin)
fWaist=0.3
; 1 = more jiggle also settles slower and less jiggle quicker, the way the physics presets do it (never below the
; Max preset's damping); 0 = only how far the parts swing changes
fJiggleDamping=1.0
; every part's jiggle and gravity factor stays within these (fMin 0.1 to 1, fMax 1 to 3)
fMin=0.3
fMax=2.0
; above 0: use this factor for every body instead of its shape (to try it by hand, e.g. 1.6 = a heavy body); the part
; sliders still count on top
fOverrideJiggle=0
fOverrideGravity=0

[Collision]
; 1 = hands, forearms, upper arms, thighs and the other breast push the breasts, belly, glutes and inner thighs out
; of the way. 0 = off. Nothing is pushed in the rest pose: a pair only pushes when it comes closer than it is
; standing still
bEnabled=1
; size of the soft parts' collision spheres, x the size measured on the body (0.5 to 1.5). Bigger = contact starts
; sooner and pushes further
fSoftScale=1.1
; the most a part can be pushed, in cm
fMaxPushBreastCm=5
fMaxPushBellyCm=3
fMaxPushThighCm=3
fMaxPushGluteCm=2.5
; 1 = the bones of one part (a breast, the belly, a glute, an inner thigh) are pushed as one soft mass: where a hand
; or an arm presses one spot, the rest of that part gives way with it, so the skin bends instead of folding into a
; sharp edge. 0 = each bone is pushed on its own
bCouplePushes=1
; 1 = a breast's collision shape, its largest push and how far its bones may differ follow its size sliders (Breasts
; Large / Small), so bigger breasts meet an arm where their skin is. 0 = the base size for every body
bBreastSize=1
; 1 = arms and hands below a breast lift it (crossed arms, a hand underneath): its skin is lifted over them, as far as
; its largest push allows, and a forearm, or an upper arm held level, above it holds it down. 0 = the pushes alone
bBreastLift=1
; 1 = measure only: find and log contacts and position snapshots, but push nothing (for diagnosing). 0 = push
bMeasureOnly=0
; 1 = the inner thighs push each other and are pushed by the other thigh. Off: in game it only met legs
; standing close together, which the skin already handles
bInnerThighs=0
; 1 = the hands and forearms push the glutes (either arm). The thighs don't: a leg swung back only 10 degrees
; would already push them 2 cm, and the fold under the buttock is the skin's own job
bGlutes=1
; 1 = other bodies count too: every body shares its arms, thighs, lower legs, feet, chest and pelvis (and an A-Body
; body its soft parts), and each A-Body body checks the bodies near it. 0 = only a body's own parts
bOtherActors=1
; 1 = contacts with other bodies are only measured and logged ("contacts with other bodies" every 5 s), nothing
; is pushed. 0 = they push like the body's own parts
bOtherActorsMeasureOnly=0
; the most other bodies can push a part, in cm (0 to 10), inside that part's own limit above. Another body can
; arrive deep inside in one frame; a smaller limit keeps the part from jumping
fMaxPushOtherCm=3
; 1 = dead bodies take part too: they share their shapes, push and are pushed (the game's own dead state).
; 0 = dead bodies are left out of collisions with other bodies (their own arms still push their own parts)
bDeadBodies=1
; a dead body lying still may update less often: its shapes are used up to this old, in ms (0 to 1000; a living or
; falling body: two frames)
fDeadMaxAgeMs=750

[Log]
; 1 = log one body's collision positions every 5 s (for diagnosing collisions; makes the log grow ~2 MB an hour)
bSnapshots=0

[World]
; 1 = watch the world-collision proxy bodies on the skeleton (two invisible bodies, one per breast): read
; only, nothing is moved or changed. The log says when the game adds them to a physics world and takes them out
; again (loading, doors, fast travel, ships, death), and compares their world with your character's. 0 = off
bProxies=1
; 1 = put every A-Body body's proxies on their own collision layer (62). The game puts them on its ragdoll layer
; when it adds them, where they could bump into characters; 0 = leave them as the game sets them
bProxyLayer=1
; 1 = and make them collide with nothing at all (nothing is pushed yet). 0 = layer 62 alone
bProxyInert=1
; 1 = move your proxies with your breasts every frame (the game itself doesn't move them). 0 = leave them where the
; game placed them
bSteer=1
; the fastest your proxies move on their own, in m/s (1 to 50). When keeping up with your breasts needs more (a
; sprint, a boost, a fast turn), they jump straight there instead, so they never hit things faster than this
fProxyMaxSpeed=20
; 1 = when your two proxies sit on one Havok physics body (the game reports one for both), move that body once a frame,
; through the left proxy. 0 = move both (each move then undoes the other)
bSteerOnce=1
; what each move's speed is worked out for. The game's physics runs in fixed substeps and keeps the time left over
; for the next frame, so an update can simulate less or more than the frame took. 1 = the time the physics really
; simulates (whether that's this frame's update or the next one's is measured from how the proxies move), 2 = this
; frame's update, 3 = the next frame's (worked out ahead), 0 = the leftover plus the frame's time, as the game's own
; moving objects use (your proxies then fall behind when you run)
iSteerTime=1

[Tuning]
; 1 = the tuning files are read again while you play: every 2 s the plugin checks the files in the TFPhysics folder
; next to this file (SFSE\Plugins\TFPhysics\*.ini) and this section, and when one changed it reads them all again
; (the other sections here are read when the game starts). 0 = read once, when the game starts
bReload=1
; 1 = the sag inside the springs and the breast gravity follow the gravity you feel (the planet's, with its
; modifiers): less on a low-gravity moon, more on a heavy planet (at most x3). 0 = the same everywhere
bPlanetGravity=1
; how much of the planet's difference from 1 g counts: 1 = all of it, 0.5 = half, 0 = none (0 to 1)
fPlanetGravity=1.0
; 1 = the [Outfit ...] sections in the tuning files count: what a body wears scales its parts' jiggle (per part the
; lowest factor of all the pieces worn). 0 = outfits change nothing
bOutfits=1
