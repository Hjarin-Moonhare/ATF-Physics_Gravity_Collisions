; TF Physics 2.1 settings for A-Body 2.0 (read when the game starts; [Tuning] and the files in the TFPhysics folder
; next to this file are read again while you play). This release build has no log file.
; Gravity: Normal (the installer's Gravity page)
[Gravity]
; 1 = the plugin drives breast gravity from the chest's tilt; 0 = its gravity offsets and shapes are off (the body's
; own lying-down correctives still work)
bEnabled=1
; forward hang when bending fully forward, in cm, before the gravity level (fLevel below)
fHangCm=1.2
; flatten toward the chest when lying face down, in cm, before the level
fPressCm=0.5
; tilts of the chest smaller than this (degrees) change nothing, so normal standing is untouched
fDeadZoneDeg=10
; hip tilt (degrees) where "forward" starts to mean lying face down, and where it fully does
fLyingStartDeg=35
fLyingFullDeg=75
; ... but only with the thighs flat too (degrees from vertical where that starts, and where it fully is). On all fours
; or in a deep bend the thighs stay near vertical, so the breasts hang instead of being pressed
fThighFlatStartDeg=30
fThighFlatFullDeg=60
; lying on the back: 0 = the whole breast slides, 1 = the breasts slump to the sides and separate, up to 1.5
fSlump=1.0
; per-bone shapes: 0 = off (only the whole breast moves), 1 = as designed, up to 1.5
; lying on a side: the lower breast spreads toward the floor and armpit, the upper one rolls over onto it
fSideSlump=1.0
; lying face down: squashed back onto the chest and spread up, down and out
fFaceDownSquash=1.0
; bent forward on the feet: a teardrop hang (the tip hangs most, the base closes in)
fHangShape=1.0
; 1 = the stretch guard: smaller or thinner breasts stretch more for the same movement, so each body's gravity
; shapes stop where its skin stretches as much as a normal body's does at its limits, and from x2 gravity up the
; breasts' spring gravity is held too; a normal body is unchanged. 0 = off (every body the full amount)
bStretchGuard=1
; the breast gravity level for every body (the installer's Gravity page: Normal x2.5, More x5, Max x6.25), in place
; of the level of A-Body's own breast corrective (0 = that level; 0.5 to 8). A normal or bigger breast gets this
; level in every shape, and it is their largest level too; smaller or thinner breasts get less (x their size, and
; the stretch guard). Breasts.ini in the TFPhysics folder sets one shape each while you play: fGravityBack,
; fGravitySide, fGravityHang, fGravityDown
fLevel=2.5
; the gravity shapes of the butt, belly, thighs, hips, calves, upper arms and torso (the installer's Gravity page:
; Normal 0.5, More 1, Max 1.25): lying down or on all fours their soft bones settle toward the floor, on top of
; the springs' own sag, up to this times the settle each part's skin takes cleanly (0 = off; up to 2). A part's
; file (TFPhysics\<part>.ini) sets that part with fGravityShape while you play
fGravityShape=0.5

[Springs]
; 1 = every A-Body spring keeps its 60 fps travel limit at any frame rate (the look the presets were tuned at)
; 0 = the game's own behaviour (more movement at low fps, less at high fps)
bFixedFrameRate=1
; gravity inside the breast springs, as a fraction of 1 g: when the body tilts or lies down they swing and settle
; under gravity. 0 = off; up to 0.3
fSpringGravity=0.03
; the same for the other jiggle springs (the installer's Gravity page; More: as far as each part's springs hold
; the sag steadily, Normal half, Max 1.25 times). 0 = off; up to 0.3. A spring's steady sag stops at 85% of its
; travel, so past that more gravity adds nothing in that direction
fSpringGravityButt=0.04
fSpringGravityBelly=0.014
fSpringGravityThighs=0.0225
fSpringGravityHips=0.015
fSpringGravityCalves=0.016
fSpringGravityArms=0.015
fSpringGravityTorso=0.0065
; 1 = while the game is paused (photo mode), every soft part sits where gravity rests it for the pose: the springs'
; frozen bounce is dropped, and their own steady sag and the parts' gravity shapes are shown. 0 = the frozen bounce
bSettleWhenPaused=1
; 1 = every body spring (A-Body's TF_ bones and the nipples) is damped against the body's motion, not the world's:
; walking or running at a steady speed it is not held back. The game damps a spring against its bone's motion in
; the world, so at a steady speed v it lags c v / S behind (c its damping, S its stiffness) and the soft springs sit
; at their travel limit; with this the damping acts on the motion relative to the body, and a start, a stop or a
; bounce still swings them. Hair and outfit springs keep the game's own damping. 0 = the game's own damping
bRelativeDamping=1

[Size]
; 1 = breast gravity follows the breast size sliders (Breasts Large / Breasts Small): bigger sags more (with a
; level from [Gravity] fLevel: smaller sags less, bigger the same).
; With [BodyShape] on, the breasts' jiggle follows them too
bEnabled=1
; gravity x (1 + fLarge x the Large slider - fSmall x the Small slider), sliders 0 to 1
fLarge=0.5
fSmall=0.5
; above 0: use this factor for every body instead of the sliders
fOverride=0
; the installed level x the size factor never goes above this (0.5 to 8). Each shape also stops at its own limit,
; where the skin stays within a safe stretch: back x2.0, side x2.4, bent forward x2.3, face down x3 ([Gravity]
; fMaxBack, fMaxSide, fMaxHang, fMaxDown). A level from [Gravity] fLevel is its own largest level instead
fMaxLevel=3.0

[BodyShape]
; 1 = each body's jiggle and gravity follow its shape (the body triangle in the character creator) and its part
; sliders. The centre of the triangle with every slider at 0 moves as the physics level you installed; thin lowers
; jiggle and gravity, muscular is firmer (less jiggle, a little more gravity), heavy raises both; a bigger part moves
; more, a smaller one less. Jiggle never travels further than the skin's tested limit for that part.
; 0 = off: every body moves alike (only the breast size sliders count, as in [Size]). The installer's
; Fixed choice installs it off, Variable on
bEnabled=0
; jiggle x (1 + fJiggleThin x thin + fJiggleMuscular x muscular + fJiggleHeavy x heavy); thin, muscular and heavy are
; 0 to 1, how far the body sits toward that corner of the triangle (-0.9 to 1.5 each)
fJiggleThin=-0.4
fJiggleMuscular=-0.25
fJiggleHeavy=0.6
; gravity the same way (the breast gravity shapes and the gravity inside every jiggle spring)
fGravityThin=-0.3
fGravityMuscular=0.15
fGravityHeavy=0.5
; on the belly, heavy counts this many times over
fBellyHeavy=1.5
; each part x (1 + this x its Large slider - this x its Small slider), sliders 0 to 1 (0 = the sliders don't count,
; up to 0.9). The breasts use [Size] fLarge and fSmall
fButt=0.5
fHips=0.3
fThighs=0.5
fCalves=0.5
fArms=0.5
; the belly x (1 - this x Waist Thin)
fWaist=0.3
; 1 = more jiggle also settles slower and less jiggle quicker, the way the physics levels do it; 0 = only how far the
; parts swing changes
fJiggleDamping=1.0
; every part's jiggle and gravity factor stays within these (fMin 0.1 to 1, fMax 1 to 3)
fMin=0.3
fMax=2.0
; above 0: use this factor for every body instead of its shape (e.g. 1.6 = a heavy body); the part sliders still
; count on top
fOverrideJiggle=0
fOverrideGravity=0

[Collision]
; collisions between bodies. 1 = hands, forearms, upper arms, thighs and the other breast push the
; breasts, belly and glutes out of the way. 0 = off. Nothing is pushed in the rest pose: a pair only pushes when it
; comes closer than it is standing still
bEnabled=1
; size of the soft parts' collision spheres, x the size measured on the body (0.5 to 1.5). Bigger = contact starts
; sooner and pushes further
fSoftScale=1.1
; the most a part can be pushed, in cm
fMaxPushBreastCm=5
fMaxPushBellyCm=3
fMaxPushThighCm=3
fMaxPushGluteCm=2.5
; 1 = the bones of one part (a breast, the belly, a glute) are pushed as one soft mass: where a hand or an arm
; presses one spot, the rest of that part gives way with it, so the skin bends instead of folding into a sharp
; edge. 0 = each bone is pushed on its own
bCouplePushes=1
; 1 = a breast's collision shape, its largest push and how far its bones may differ follow its size sliders
; (Breasts Large / Small), so bigger breasts meet an arm where their skin is. 0 = the base size for every body
bBreastSize=1
; 1 = arms and hands below a breast lift it (crossed arms, a hand underneath): its skin is lifted over them, as far
; as its largest push allows, and a forearm, or an upper arm held level, above it holds it down. 0 = the pushes alone
bBreastLift=1
; 1 = find contacts but push nothing. 0 = push
bMeasureOnly=0
; 1 = the inner thighs push each other. Off: the skin already handles legs standing close together
bInnerThighs=0
; 1 = the hands and forearms push the glutes (either arm)
bGlutes=1
; 1 = other characters count too: every body near an A-Body body shares its arms, thighs, lower legs, feet, chest
; and pelvis, and A-Body bodies push each other's soft parts. 0 = only a body's own parts
bOtherActors=1
; 1 = contacts with other characters are only found, nothing is pushed. 0 = they push
bOtherActorsMeasureOnly=0
; the most other characters can push a part, in cm (0 to 10), inside that part's own limit above. Another body can
; arrive deep inside in one frame; a smaller limit keeps the part from jumping
fMaxPushOtherCm=3
; 1 = dead bodies take part too. 0 = they are left out of collisions with other bodies (off in A-Body)
bDeadBodies=0

[BreastMass]
; 1 = each whole breast moves as one damped mass on its anchor (L_Pecs, R_Pecs), in the chest's own axes: standing
; still or moving steadily it rests, a step's bounce, a stop or a landing swings it, it drops further than it rises
; and swings further out than in. The breast springs, the tips and the nipple hang under the anchor and ride on it,
; so the breast moves as one and the springs add the follow-through. A cut or a teleport starts it again at rest.
; 0 = the springs alone
bEnabled=1
; its swing x this (0 to 2), on top of the breasts' level
fScale=1.0

[GluteMass]
; 1 = each glute moves as one damped mass on L_Butt / R_Butt (the bone its springs hang on), in the body's own axes:
; heavier and softer than a breast, dropping further than it rises, held more firmly fore and aft. 0 = off
bEnabled=1
; its swing x this (0 to 2), on top of the butt's level
fScale=1.0

[FreeMorph]
; 1 = hand contact: the skin of your character's breasts gives way to its own hands and arms. A flesh contact is
; worked out every frame (fingers sink in, the flesh moves around and between them, the skin a finger presses holds
; to it and slides past a firm drag) and written into the body's free performance morph. A-Body ships its data: the
; morph TFFREE in the body's performance morph.dat and FreeMorph.bin in the TFPhysics folder next to this file (for
; your skin choice). Only your own character; the collisions must be on ([Collision] bEnabled). 0 = off
bEnabled=1
; a key that switches the mode (a Windows key code: 0 = none, 111 = Numpad /, sent with NumLock on or off): contact,
; a 1 cm dent going round the left breast (a check of the write path), the file's own shape (at rest), off
iModeKey=0
; the mode at the start: 2 contact, 1 the moving dent, 0 the file's own shape, 3 off
iStartMode=2
; how far a pressing finger drags the skin along before it slides, in mm (0 = no grip; -1 = the data's: 10)
fGrip=-1
; how springy that hold is, in mm per newton (at least 7; -1 = the data's: 10): lower holds harder
fHoldGive=-1
; how deep a press may go before the finger goes through: the data's cap (a third to a half of the tissue's depth)
; x this (0.3 to 1.5)
fCapScale=1.0
; the moving dent's turns per second (0 to 4)
fDentSpeed=0.5
; 1 = in contact mode the arms' capsule pushes and the lift over the arms work on the breasts too, on top. 0 = the
; free morph alone answers your hands and arms there
bOwnPushes=0
[Tuning]
; 1 = the tuning files are read again while you play: every 2 s the plugin checks the files in the TFPhysics folder
; next to this file (SFSE\Plugins\TFPhysics\*.ini) and this section, and when one changed it reads them all again
; (the other sections here are read when the game starts). 0 = read once, when the game starts
bReload=1
; 1 = the sag inside the springs and the breast gravity follow the gravity you feel (the planet's, with its
; modifiers): less on a low-gravity moon, more on a heavy planet (at most x3). 0 = the same everywhere
bPlanetGravity=1
; how much of the planet's difference from 1 g counts: 1 = all of it, 0.5 = half, 0 = none (0 to 1)
fPlanetGravity=1.0
; 1 = the [Outfit ...] sections in the tuning files count: what a body wears scales its parts' jiggle (per part the
; lowest factor of all the pieces worn). 0 = outfits change nothing
bOutfits=1
